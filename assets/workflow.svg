<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 590" width="840" height="590" fill="none">
  <defs>
    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      }
      .card {
        transition: all 0.2s ease;
      }
    </style>
    
    <!-- Linear Gradients -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="376" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F1420" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    
    <linearGradient id="engineGrad" x1="40" y1="130" x2="800" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8EEFC" />
      <stop offset="100%" stop-color="#EEF4FF" />
    </linearGradient>

    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 5 5 L 0 8.5 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Canvas Container -->
  <rect width="840" height="590" rx="16" fill="#040711" stroke="#1E293B" stroke-width="1.2" />

  <!-- ==================== TOP: AI CODING AGENT ==================== -->
  <g transform="translate(420, 26)">
    <!-- Robot Icon -->
    <g transform="translate(-16, 0)">
      <rect x="2" y="6" width="28" height="20" rx="6" stroke="#F8FAFC" stroke-width="2" fill="none" />
      <circle cx="10" cy="15" r="2.2" fill="#F8FAFC" />
      <circle cx="22" cy="15" r="2.2" fill="#F8FAFC" />
      <!-- Antenna -->
      <path d="M16 6V1M14 1H18" stroke="#F8FAFC" stroke-width="1.8" stroke-linecap="round" />
      <!-- Ears -->
      <path d="M0 13H2M30 13H32" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Title & Subtitle -->
    <text x="0" y="44" text-anchor="middle" class="font-sans" font-size="16" font-weight="600" fill="#F8FAFC">AI coding agent</text>
    <text x="0" y="63" text-anchor="middle" class="font-sans" font-size="13" font-weight="400" fill="#94A3B8">Writes or modifies code</text>
  </g>

  <!-- Arrow down to VibeCI Engine -->
  <path d="M420 100V126" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)" />

  <!-- ==================== MIDDLE HERO: VIBECI VERIFICATION ENGINE ==================== -->
  <g transform="translate(36, 134)">
    <rect width="768" height="92" rx="12" fill="url(#engineGrad)" stroke="#CBD5E1" stroke-width="1" />

    <!-- Shield Icon -->
    <g transform="translate(384, 14)">
      <path d="M0 2L13 6.8V17.5C13 25.5 7.5 32.5 0 35C-7.5 32.5 -13 25.5 -13 17.5V6.8L0 2Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5" stroke-linejoin="round" />
      <path d="M-4.5 17L-1.5 20.2L5.2 13.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Engine Text -->
    <text x="384" y="63" text-anchor="middle" class="font-sans" font-size="18" font-weight="700" fill="#0F172A">VibeCI Verification Engine</text>
    <text x="384" y="80" text-anchor="middle" class="font-sans" font-size="13.5" font-weight="400" fill="#475569">Inspects, builds, analyzes and exercises the project</text>
  </g>

  <!-- ==================== 2x2 GRID OF VERIFICATION CARDS ==================== -->

  <!-- ROW 1, COL 1: Static Analysis -->
  <g transform="translate(36, 240)">
    <rect width="376" height="92" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
    <!-- Scan / Frame Icon -->
    <g transform="translate(20, 18)" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M1 6V2C1 1.45 1.45 1 2 1H6" />
      <path d="M15 1H19C19.55 1 20 1.45 20 2V6" />
      <path d="M20 15V19C20 19.55 19.55 20 19 20H15" />
      <path d="M6 20H2C1.45 20 1 19.55 1 19V15" />
      <circle cx="10.5" cy="10.5" r="2.5" stroke-width="1.8" />
    </g>
    <text x="20" y="58" class="font-sans" font-size="15" font-weight="600" fill="#F8FAFC">Static analysis</text>
    <text x="20" y="76" class="font-sans" font-size="12.5" font-weight="400" fill="#94A3B8">Types, imports, code defects, dependencies</text>
  </g>

  <!-- ROW 1, COL 2: Production Build -->
  <g transform="translate(428, 240)">
    <rect width="376" height="92" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
    <!-- Hammer Icon -->
    <g transform="translate(20, 18)" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M15.5 3.5L18.5 6.5L14 11L12.5 9.5L14.5 7.5L13.5 6.5L11.5 8.5L10 7L14.5 2.5L15.5 3.5Z" fill="#E2E8F0" fill-opacity="0.3" />
      <path d="M10 7L3 14C2.2 14.8 2.2 16 3 16.8L4.2 18C5 18.8 6.2 18.8 7 18L14 11" />
    </g>
    <text x="20" y="58" class="font-sans" font-size="15" font-weight="600" fill="#F8FAFC">Production build</text>
    <text x="20" y="76" class="font-sans" font-size="12.5" font-weight="400" fill="#94A3B8">Compilation and bundling failures</text>
  </g>

  <!-- ROW 2, COL 1: Behavior Checks -->
  <g transform="translate(36, 346)">
    <rect width="376" height="92" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
    <!-- Flask / Beaker Icon -->
    <g transform="translate(20, 18)" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M8 2H14" />
      <path d="M10 2V7L3.5 17.5C2.8 18.6 3.6 20 4.9 20H17.1C18.4 20 19.2 18.6 18.5 17.5L12 7V2" />
      <path d="M6 14H16" stroke-width="1.6" stroke-dasharray="2 2" />
      <circle cx="10" cy="17" r="1" fill="#E2E8F0" />
      <circle cx="13" cy="16" r="1" fill="#E2E8F0" />
    </g>
    <text x="20" y="58" class="font-sans" font-size="15" font-weight="600" fill="#F8FAFC">Behavior checks</text>
    <text x="20" y="76" class="font-sans" font-size="12.5" font-weight="400" fill="#94A3B8">Existing and generated checks</text>
  </g>

  <!-- ROW 2, COL 2: Runtime Checks -->
  <g transform="translate(428, 346)">
    <rect width="376" height="92" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
    <!-- Network Branch / Nodes Icon -->
    <g transform="translate(20, 18)" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="11" cy="4" r="3" />
      <circle cx="4" cy="17" r="3" />
      <circle cx="18" cy="17" r="3" />
      <path d="M11 7V11M11 11L5.5 14.5M11 11L16.5 14.5" />
    </g>
    <text x="20" y="58" class="font-sans" font-size="15" font-weight="600" fill="#F8FAFC">Runtime checks</text>
    <text x="20" y="76" class="font-sans" font-size="12.5" font-weight="400" fill="#94A3B8">Startup, routes, API responses and smoke tests</text>
  </g>

  <!-- Arrow down to Report -->
  <path d="M420 450V476" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)" />

  <!-- ==================== BOTTOM: ACTIONABLE REPORT ==================== -->
  <g transform="translate(420, 500)">
    <text x="0" y="24" text-anchor="middle" class="font-sans" font-size="16" font-weight="700" fill="#F8FAFC">One actionable verification report</text>
    <text x="0" y="46" text-anchor="middle" class="font-sans" font-size="13.5" font-weight="400" fill="#94A3B8">What passed, what failed, what was not checked, and the evidence the AI needs to fix problems.</text>
  </g>
</svg>
